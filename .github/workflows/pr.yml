name: Run pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1
      - name: Run pnpm install
        run: pnpm install
      - name: Run checks
        run: npx astro check
      - name: Make OpenGraph image
        run: ./src/members/bin/makeOpenGraphImage.ts
